# All other configurations are set by default. If you want to add new config options,
# please modify ../connectomics/config/defaults.py
SYSTEM:
  NUM_GPUS: 1
  NUM_CPUS: 1
MODEL:
  INPUT_SIZE: [5, 257, 257]
  OUTPUT_SIZE: [5, 257, 257]
  IN_PLANES: 1
  NORM_MODE: sync_bn
  FILTERS: [32, 64, 96, 128, 160]
DATASET:
  IMAGE_NAME: nk_mouse_gt1_em.h5
  LABEL_NAME: nk_mouse_gt1_synapse.h5
  INPUT_PATH: /example_working_dir/path/to/data/
  OUTPUT_PATH: /example_working_dir/synapse_unet_outputs/
  PAD_SIZE: [0, 32, 32]
  REJECT_SAMPLING:
    SIZE_THRES: 1000
    P: 0.95
  DISTRIBUTED: False
SOLVER:
  LR_SCHEDULER_NAME: WarmupCosineLR
  BASE_LR: 0.02
  ITERATION_STEP: 1
  ITERATION_SAVE: 5000
  ITERATION_TOTAL: 200000
  SAMPLES_PER_BATCH: 2
INFERENCE:
  INPUT_SIZE: [5, 257, 257]
  OUTPUT_SIZE: [5, 257, 257]
  OUTPUT_ACT: ["sigmoid"]
  IMAGE_NAME: /example_working_dir/nk_mouse_gt2_em_padded.h5
  OUTPUT_PATH: /example_working_dir/synapse_unet_outputs/
  OUTPUT_NAME: result.h5
  DO_SINGLY: False
  PAD_SIZE: [0, 32, 32]
  AUG_MODE: mean
  AUG_NUM: 8
  STRIDE: [2, 128, 128]
  SAMPLES_PER_BATCH: 8
